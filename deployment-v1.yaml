apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-upgrade-deploy
  namespace: default
  labels:
    app: multi-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: multi-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%        # Быстрый старт новых подов
      maxUnavailable: 0%    # Без потери доступности старых
  template:
    metadata:
      labels:
        app: multi-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.19
          ports:
            - containerPort: 80
        - name: multitool
          image: wbitt/network-multitool
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "11443"
